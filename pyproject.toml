[project]
name = "murim-ai-factory"
version = "0.1.0"
description = "AI-powered Wuxia content generation factory"
authors = [
    {name = "hoonoh57"}
]
dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
    "rich>=13.7.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
