[project]
name = "murim"
version = "0.1.0"
description = "Self-evolving Multi-Agent Content Factory for Wuxia content"
authors = [
    {name = "Antigravity Agent", email = "agent@antigravity.ai"}
]
dependencies = [
    "anthropic",
    "pydantic",
    "python-dotenv"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
