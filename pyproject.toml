[project]
name = "murim-ai-factory"
version = "0.2.0"
description = "AI-powered Wuxia content generation factory with Human-Relay UI"
authors = [
    {name = "hoonoh57"}
]
dependencies = [
    "anthropic>=0.18.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
